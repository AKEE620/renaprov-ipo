<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil de risque investisseur</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --red:#A6192E; --red-dark:#7C1322; --red-light:#F4E3E6;
  --ink:#1A1A1A; --grey-900:#2B2B2B; --grey-600:#6B6B6B;
  --grey-300:#D8D4CE; --grey-150:#ECE8E2; --grey-100:#F5F2EE; --paper:#FFFDFA;
  --success:#2F6F4E; --warning:#9A5B12; --radius:10px;
  --shadow:0 1px 2px rgba(26,26,26,.06), 0 8px 24px rgba(26,26,26,.07);
  --serif:Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--grey-100);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;}
.brand-strip{height:4px;background:linear-gradient(to right,var(--red) 0 34%,var(--ink) 34% 67%,var(--grey-300) 67% 100%);}
.shell{max-width:1000px;margin:0 auto;padding:28px 18px 56px;}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:3px solid var(--red);padding-bottom:14px;margin-bottom:26px;}
.masthead .org{font-family:var(--serif);font-weight:700;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--red);}
.masthead h1{font-family:var(--serif);font-size:23px;margin:4px 0 0;color:var(--ink);font-weight:600;}
.admin-link{background:none;border:1px solid var(--grey-300);color:var(--grey-600);font-size:12px;cursor:pointer;padding:7px 14px;border-radius:20px;font-family:var(--sans);}
.admin-link:hover{color:var(--ink);border-color:var(--ink);}

/* ----- Rail horizontal ----- */
.rail{display:flex;align-items:flex-start;justify-content:center;gap:0;margin-bottom:30px;overflow-x:auto;padding:6px 2px 12px;}
.step{display:flex;flex-direction:column;align-items:center;gap:7px;flex:0 0 auto;min-width:58px;text-align:center;opacity:.48;}
.step.active{opacity:1;}
.step.done{opacity:.9;}
.step .num{width:32px;height:32px;border-radius:50%;background:var(--grey-300);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700;transition:background .2s,box-shadow .2s;}
.step.active .num{background:var(--red);box-shadow:0 0 0 5px var(--red-light);}
.step.done .num{background:var(--success);}
.step .label{font-size:11px;color:var(--grey-900);max-width:90px;line-height:1.25;}
.connector{flex:1 1 28px;height:2px;background:var(--grey-300);margin-top:16px;min-width:14px;max-width:60px;}
.connector.done{background:var(--success);}
@media (max-width:680px){.step .label{font-size:9.5px;max-width:62px;}.step .num{width:27px;height:27px;font-size:11.5px;}.connector{max-width:18px;}}

.panel{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 30px;min-height:340px;}
@media (max-width:600px){.panel{padding:20px 16px;}}
.panel h2{font-family:var(--serif);font-size:20px;margin:0 0 6px;color:var(--ink);}
.panel .lead{color:var(--grey-600);font-size:13.5px;margin:0 0 20px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--grey-900);margin-bottom:6px;}
.field input[type=text],.field input[type=date],.field select,.field textarea{
  width:100%;padding:11px 12px;border:1px solid var(--grey-300);border-radius:7px;font-family:var(--sans);font-size:14.5px;background:#fff;color:var(--ink);
}
.field textarea{min-height:64px;resize:vertical;}

.question{margin-bottom:24px;}
.question .q-label{font-weight:600;font-size:14.5px;margin-bottom:10px;color:var(--ink);}
.options{display:flex;flex-direction:column;gap:9px;}
.option{border:1px solid var(--grey-300);border-radius:9px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:border-color .15s,background .15s,transform .1s;}
.option:hover{border-color:var(--red);}
.option.selected{border-color:var(--red);background:var(--red-light);}
.option input{accent-color:var(--red);width:17px;height:17px;}
.option .opt-text{font-size:14px;}

.curve-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
@media (max-width:680px){.curve-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:420px){.curve-grid{grid-template-columns:repeat(2,1fr);}}
.curve-card{border:1px solid var(--grey-300);border-radius:10px;padding:10px 6px 12px;text-align:center;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s,transform .1s;}
.curve-card:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:var(--shadow);}
.curve-card.selected{border-color:var(--red);background:var(--red-light);}
.val-pos{color:var(--success);font-weight:700;font-size:12.5px;}
.val-neg{color:var(--red);font-weight:700;font-size:12.5px;margin-top:2px;}
.curve-bars{display:flex;flex-direction:column;height:66px;margin:4px 0;}
.half{flex:1;display:flex;justify-content:center;}
.half.top{align-items:flex-end;}
.half.bottom{align-items:flex-start;}
.baseline{height:1px;background:var(--grey-300);}
.bar{width:15px;border-radius:3px 3px 0 0;}
.bar.neg{border-radius:0 0 3px 3px;}
.bar.pos{background:var(--success);}
.bar.neg{background:var(--red);}
.curve-card .lbl{font-size:13px;font-weight:700;margin-top:6px;color:var(--ink);}

.grid-connaissance{width:100%;border-collapse:collapse;font-size:13px;}
.grid-connaissance th,.grid-connaissance td{border:1px solid var(--grey-300);padding:9px 8px;}
.grid-connaissance th{background:var(--grey-150);font-weight:700;text-align:left;font-size:12px;}
.grid-connaissance select{width:100%;padding:7px;border:1px solid var(--grey-300);border-radius:6px;font-family:var(--sans);font-size:13px;}

.btn-row{display:flex;justify-content:space-between;margin-top:26px;flex-wrap:wrap;gap:10px;}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:12px 22px;border-radius:8px;border:1px solid transparent;cursor:pointer;}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red-dark);}
.btn-primary:disabled{background:var(--grey-300);cursor:not-allowed;}
.btn-ghost{background:transparent;border-color:var(--grey-300);color:var(--ink);}
.btn-ghost:hover{border-color:var(--ink);}

.alert{border-left:4px solid var(--warning);background:#FBF3E7;padding:14px 16px;border-radius:6px;font-size:13.3px;margin-bottom:16px;}
.alert strong{display:block;margin-bottom:4px;}
.alert.ok{border-left-color:var(--success);background:#EAF3EE;}
.checkbox-line{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin:10px 0 4px;}
.checkbox-line input{margin-top:3px;accent-color:var(--red);}

.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
@media (max-width:560px){.score-grid{grid-template-columns:1fr;}}
.score-card{background:var(--grey-100);border-radius:9px;padding:15px 17px;}
.score-card .k{font-size:11.5px;color:var(--grey-600);text-transform:uppercase;letter-spacing:.04em;}
.score-card .v{font-family:var(--serif);font-size:21px;margin-top:2px;}
.gauge{display:flex;gap:4px;margin:10px 0 2px;}
.gauge .seg{flex:1;height:9px;border-radius:4px;background:var(--grey-300);}
.gauge .seg.on{background:var(--red);}
.niveau-badge{display:inline-block;background:var(--red);color:#fff;font-weight:700;font-size:13px;padding:5px 12px;border-radius:20px;}
.choice-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 6px;}
.choice-pill{border:1px solid var(--grey-300);border-radius:20px;padding:9px 17px;font-size:13px;cursor:pointer;}
.choice-pill.selected{border-color:var(--red);background:var(--red-light);font-weight:600;}
.choice-pill.disabled{opacity:.35;cursor:not-allowed;}
.profile-name{font-family:var(--serif);font-size:21px;margin:4px 0 4px;}
.muted{color:var(--grey-600);}

.alloc-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:14px;}
.alloc-table th,.alloc-table td{padding:8px;border-bottom:1px solid var(--grey-150);text-align:left;}
.alloc-table th{color:var(--grey-600);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;}
.chart-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-top:10px;}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13.5px;}
.legend-item{display:flex;align-items:center;}

.footer-note{margin-top:32px;font-size:11.3px;color:var(--grey-600);border-top:1px solid var(--grey-150);padding-top:14px;}

/* ----- Mode administrateur ----- */
.admin-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
.admin-tab{padding:8px 15px;border-radius:20px;border:1px solid var(--grey-300);background:#fff;font-size:12.5px;cursor:pointer;font-family:var(--sans);}
.admin-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.adm-question{border:1px solid var(--grey-150);border-radius:9px;padding:16px;margin-bottom:14px;background:#fdfcfa;}
.adm-field{margin-bottom:10px;}
.adm-field label{display:block;font-size:11.5px;color:var(--grey-600);margin-bottom:3px;}
.adm-field input,.adm-field textarea{width:100%;padding:8px 10px;border:1px solid var(--grey-300);border-radius:6px;font-size:13.5px;font-family:var(--sans);}
.adm-field textarea{min-height:54px;resize:vertical;}
.adm-options{display:flex;flex-direction:column;gap:9px;margin:10px 0;}
.adm-option{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--grey-100);padding:9px;border-radius:7px;}
.adm-option input[type=text]{flex:1;min-width:130px;padding:7px 9px;border:1px solid var(--grey-300);border-radius:6px;font-size:13px;}
.adm-option input[type=number]{width:78px;padding:7px 9px;border:1px solid var(--grey-300);border-radius:6px;font-size:13px;}
.adm-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:6px;}
.btn-mini{font-size:12.5px;padding:7px 13px;border-radius:6px;border:1px solid var(--grey-300);background:#fff;cursor:pointer;font-family:var(--sans);}
.btn-mini.danger{border-color:var(--red);color:var(--red);}
.btn-mini:disabled{opacity:.35;cursor:not-allowed;}
.sum-ok{color:var(--success);font-size:12.5px;font-weight:600;margin-top:6px;}
.sum-warn{color:var(--warning);font-size:12.5px;font-weight:600;margin-top:6px;}
.adm-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grey-600);}
.admin-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;}

.modal-backdrop{position:fixed;inset:0;background:rgba(26,26,26,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;}
.modal-card{background:var(--paper);border-radius:12px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 24px;border-bottom:1px solid var(--grey-150);position:sticky;top:0;background:var(--paper);}
.modal-head h2{font-family:var(--serif);font-size:19px;}
.modal-close{background:none;border:1px solid var(--grey-300);border-radius:20px;padding:7px 16px;font-size:12.5px;cursor:pointer;font-family:var(--sans);}
.modal-body{padding:6px 24px 24px;}
.modal-body h3{font-family:var(--serif);font-size:16px;color:var(--red);margin:20px 0 8px;}
.modal-body p{font-size:13.8px;margin:0 0 10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   CONFIGURATION — modifiable directement ici, ou via le « Mode administrateur »
   de l'outil (recommandé : tout ce qui est listé ci-dessous est éditable
   depuis l'interface, sans toucher au code).
   Étape suivante du chantier : cette même structure sera reprise dans des
   tables Supabase pour une édition centralisée et persistante.
   ========================================================================= */
const CONFIG = {
  organisation: "Afriland Bourse & Investissement",
  adminPasscode: "admin2026",

  identification: {
    champs: [
      { id: "nom", label: "Nom et prénoms", type: "text", requis: true },
      { id: "dateNaissance", label: "Date de naissance", type: "date", requis: true },
      { id: "statutMatrimonial", label: "Statut matrimonial", type: "select", requis: false, options: [
        "Célibataire", "Marié(e)", "Divorcé(e) / Séparé(e)", "Veuf(ve)"
      ]},
      { id: "objectif", label: "Objectif principal du placement", type: "select", requis: true, options: [
        "Conservation du capital en vue d'un projet",
        "Constitution d'une épargne de précaution",
        "Revenus complémentaires à court terme",
        "Transmission de patrimoine",
        "Revenus complémentaires à moyen ou long terme"
      ]},
      { id: "dateRemplissage", label: "Date", type: "date", requis: true }
    ]
  },

  capacite: [
    { id: "age", label: "Âge", options: [
      { label: "Plus de 65 ans", points: 1 }, { label: "55 à 65 ans", points: 2 },
      { label: "45 à 55 ans", points: 3 }, { label: "30 à 45 ans", points: 4 }, { label: "Moins de 30 ans", points: 5 }
    ]},
    { id: "horizon", label: "Horizon de placement envisagé", options: [
      { label: "Moins de 1 an", points: 1 }, { label: "1 à 3 ans", points: 2 },
      { label: "3 à 5 ans", points: 3 }, { label: "5 à 10 ans", points: 4 }, { label: "Plus de 10 ans", points: 5 }
    ]},
    { id: "patrimoine", label: "Patrimoine financier net (FCFA) — tranches provisoires, à valider", options: [
      { label: "Moins de 5 000 000 FCFA", points: 1 }, { label: "5 000 000 à 20 000 000 FCFA", points: 2 },
      { label: "20 000 000 à 50 000 000 FCFA", points: 3 }, { label: "50 000 000 à 150 000 000 FCFA", points: 4 },
      { label: "Plus de 150 000 000 FCFA", points: 5 }
    ]},
    { id: "revenu", label: "Revenus annuels nets (salaire, pension, revenus locatifs, etc., hors revenus exceptionnels) — tranches provisoires, à valider", options: [
      { label: "Moins de 1 200 000 FCFA / an", points: 1 }, { label: "1 200 000 à 4 000 000 FCFA / an", points: 2 },
      { label: "4 000 000 à 10 000 000 FCFA / an", points: 3 }, { label: "10 000 000 à 25 000 000 FCFA / an", points: 4 },
      { label: "Plus de 25 000 000 FCFA / an", points: 5 }
    ]},
    { id: "partInvestie", label: "Part de votre patrimoine que représente la somme à investir", options: [
      { label: "Plus de 75 %", points: 1 }, { label: "50 à 75 %", points: 2 },
      { label: "25 à 50 %", points: 3 }, { label: "10 à 25 %", points: 4 }, { label: "Moins de 10 %", points: 5 }
    ]},
    { id: "evolutionSituation", label: "Comment voyez-vous évoluer votre situation financière dans les 3 à 5 prochaines années ?", options: [
      { label: "Je prévois une détérioration (hausse des dépenses, baisse des revenus, etc.)", points: 1 },
      { label: "Je ne prévois aucun changement notable", points: 3 },
      { label: "Je prévois une amélioration (avancement professionnel, héritage, vente d'un bien, etc.)", points: 5 }
    ]},
    { id: "depenseImprevue", label: "Face à une dépense imprévue importante, vous seriez amené(e) à :", options: [
      { label: "Vendre tous mes investissements, même à perte", points: 1 },
      { label: "Vendre une partie de mes investissements", points: 3 },
      { label: "N'avoir aucune vente à effectuer", points: 5 }
    ]}
  ],

  tolerance: [
    { id: "reactionPerte30", label: "Si vos investissements perdent 30 % en un mois, comment réagissez-vous ?", options: [
      { label: "Je récupère tout", points: 1 }, { label: "Je récupère une partie", points: 2 },
      { label: "Je continue ma stratégie sans paniquer", points: 4 }, { label: "J'investis même un peu plus", points: 5 }
    ]},
    { id: "seuilMalaise", label: "À partir de quel niveau de baisse commenceriez-vous à être mal à l'aise ?", options: [
      { label: "Toute baisse", points: 1 }, { label: "Une baisse d'au moins 15 %", points: 2 },
      { label: "Une baisse d'au moins 30 %", points: 3 }, { label: "Une baisse d'au moins 50 %", points: 5 }
    ]},
    { id: "courbe", type: "courbes", label: "Parmi ces profils de fluctuation annuelle d'un portefeuille, lequel vous mettrait le plus à l'aise ?", options: [
      { label: "A", points: 1, gain: 5, perte: 2 }, { label: "B", points: 2, gain: 10, perte: 5 },
      { label: "C", points: 3, gain: 18, perte: 10 }, { label: "D", points: 4, gain: 28, perte: 18 },
      { label: "E", points: 5, gain: 40, perte: 28 }
    ]},
    { id: "accordRisque", label: "« Je suis prêt(e) à investir une part importante de mon épargne dans des actifs risqués mais plus rentables »", options: [
      { label: "Pas du tout d'accord", points: 1 }, { label: "Neutre", points: 3 }, { label: "Entièrement d'accord", points: 5 }
    ]}
  ],

  connaissance: {
    instruments: ["Titres d'État (OTA/BTA)", "OPCVM / fonds d'investissement", "Actions cotées BRVM/BVMAC"],
    niveauxConnaissance: ["Aucune", "Rudimentaire", "Moyenne", "Bonne", "Très bonne"],
    niveauxExperience: ["Aucune", "1 à 2 ans / 1 à 9 opérations", "3 à 5 ans / 10 à 15 opérations", "6 à 9 ans / 16 à 25 opérations", "10 ans et plus / plus de 25 opérations"],
    instrumentsSensibles: ["OPCVM / fonds d'investissement", "Actions cotées BRVM/BVMAC"]
  },

  baremeNiveaux: {
    capacite: [{ min: 7, max: 12, niveau: 1 }, { min: 13, max: 18, niveau: 2 }, { min: 19, max: 24, niveau: 3 }, { min: 25, max: 30, niveau: 4 }, { min: 31, max: 35, niveau: 5 }],
    tolerance: [{ min: 4, max: 7, niveau: 1 }, { min: 8, max: 10, niveau: 2 }, { min: 11, max: 13, niveau: 3 }, { min: 14, max: 16, niveau: 4 }, { min: 17, max: 20, niveau: 5 }]
  },

  profils: [
    { niveau: 1, nom: "Faible (Prudent)", description: "Priorité à la préservation du capital ; rendement modeste et peu volatil.", horizon: "1 à 2 ans" },
    { niveau: 2, nom: "Plutôt faible (Conservateur-équilibré)", description: "Léger surcroît de rendement recherché, avec de faibles fluctuations possibles.", horizon: "2 à 4 ans" },
    { niveau: 3, nom: "Modéré (Équilibré)", description: "Fluctuations modérées acceptées en échange d'un potentiel de rendement plus élevé.", horizon: "4 à 6 ans" },
    { niveau: 4, nom: "Plutôt fort (Dynamique)", description: "Croissance à long terme recherchée, fluctuations importantes et pertes temporaires possibles.", horizon: "6 à 8 ans" },
    { niveau: 5, nom: "Fort (Offensif)", description: "Maximisation du potentiel de rendement à long terme ; forte volatilité acceptée.", horizon: "8 ans et plus" }
  ],

  allocation: [
    { niveau: 1, obligataire: 80, opcvm: 10, actions: 0, liquidites: 10 },
    { niveau: 2, obligataire: 55, opcvm: 25, actions: 10, liquidites: 10 },
    { niveau: 3, obligataire: 35, opcvm: 25, actions: 30, liquidites: 10 },
    { niveau: 4, obligataire: 15, opcvm: 20, actions: 55, liquidites: 10 },
    { niveau: 5, obligataire: 0, opcvm: 10, actions: 80, liquidites: 10 }
  ],
  couleursAllocation: { obligataire: "#A6192E", opcvm: "#D98C99", actions: "#1A1A1A", liquidites: "#B8B2A8" },

  // Contenu pédagogique affiché via le bouton « Comprendre mon profilage de risque ».
  // Volontairement dépourvu de tout barème ou nombre de points : il explique le sens
  // des questions, pas la manière dont elles sont notées.
  explications: {
    identification: {
      intro: "Ces informations ne sont pas notées : elles aident votre conseiller à comprendre le contexte de votre projet, pas à calculer un score.",
      criteres: [
        { titre: "Statut matrimonial", texte: "Cette information éclaire la discussion avec votre conseiller (revenus du foyer, charges partagées, projets communs), mais n'influence pas votre score : son effet sur la capacité de risque dépend de trop de facteurs propres à chaque situation pour être réduit à une règle générale." },
        { titre: "Objectif principal du placement", texte: "Il oriente le type de portefeuille recherché (sécuriser un projet précis, préparer sa retraite, transmettre un capital), mais ne modifie pas non plus le niveau de risque calculé : un même profil de risque peut servir des objectifs différents." }
      ]
    },
    capacite: {
      intro: "Cette partie mesure des faits objectifs sur votre situation financière, pas votre envie de prendre des risques — cela vient dans l'étape suivante. L'idée est de déterminer la marge de manœuvre dont vous disposez réellement, indépendamment de ce que vous ressentez.",
      criteres: [
        { titre: "Âge", texte: "Plus vous êtes jeune, plus vous avez de temps pour vous remettre d'une baisse de marché avant d'avoir besoin de cet argent. Exemple : une baisse de 20 % à 30 ans peut se rattraper sur plusieurs années ; la même baisse à 68 ans, juste avant la retraite, laisse beaucoup moins de temps pour la compenser." },
        { titre: "Horizon de placement", texte: "Le principe est le même que pour l'âge : plus l'argent reste investi longtemps avant d'être nécessaire, plus on peut traverser des creux de marché temporaires sans être contraint de vendre au mauvais moment." },

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function getAt(obj, path) { return path.split(".").reduce((o, k) => o[/^\d+$/.test(k) ? Number(k) : k], obj); }
function setAt(obj, path, value) {
  const keys = path.split(".");
  const last = keys.pop();
  const parent = keys.reduce((o, k) => o[/^\d+$/.test(k) ? Number(k) : k], obj);
  parent[/^\d+$/.test(last) ? Number(last) : last] = value;
}
function removeAt(obj, path) {
  const keys = path.split(".");
  const idx = Number(keys.pop());
  const parent = keys.reduce((o, k) => o[/^\d+$/.test(k) ? Number(k) : k], obj);
  parent.splice(idx, 1);
}
function hexToRgb(hex) { const c = hex.replace("#", ""); return { r: parseInt(c.substr(0, 2), 16), g: parseInt(c.substr(2, 2), 16), b: parseInt(c.substr(4, 2), 16) }; }
function luminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}
function textColorFor(bgHex) {
  const L = luminance(bgHex);
  const contrastWhite = 1.05 / (L + 0.05);
  const contrastBlack = (L + 0.05) / 0.05;
  return contrastBlack > contrastWhite ? "#1A1A1A" : "#FFFFFF";
}

/* ------------------------- MOTEUR DE CALCUL ------------------------- */
function calcScore(answers, blocConfig) {
  let total = 0;
  blocConfig.forEach(q => { const idx = answers[q.id]; if (idx !== undefined && q.options[idx]) total += q.options[idx].points; });
  return total;
}
function maxScore(blocConfig) {
  return blocConfig.reduce((sum, q) => sum + Math.max(...q.options.map(o => o.points)), 0);
}
function niveauFromScore(score, bareme) { const found = bareme.find(b => score >= b.min && score <= b.max); return found ? found.niveau : 1; }
function calculerResultat() {
  const scoreCap = calcScore(state.capacite, CONFIG.capacite);
  const scoreTol = calcScore(state.tolerance, CONFIG.tolerance);
  const niveauCap = niveauFromScore(scoreCap, CONFIG.baremeNiveaux.capacite);
  const niveauTol = niveauFromScore(scoreTol, CONFIG.baremeNiveaux.tolerance);
  return { scoreCap, scoreTol, niveauCap, niveauTol, niveauCalcule: Math.min(niveauCap, niveauTol) };
}
function gardeFouDeclenche(niveauRetenu) {
  if (niveauRetenu < 4) return false;
  return CONFIG.connaissance.instrumentsSensibles.some(instr => {
    const rep = state.connaissance[instr];
    if (!rep || rep.connaissance === undefined || rep.experience === undefined) return true;
    return rep.connaissance === 0 || rep.experience === 0;
  });
}
function profilParNiveau(n) { return CONFIG.profils.find(p => p.niveau === n); }
function allocationParNiveau(n) { return CONFIG.allocation.find(a => a.niveau === n); }

/* ----------------------------- VALIDATION PAR ÉTAPE ----------------------------- */
function validateStep(i) {
  if (i === 0) return CONFIG.identification.champs.every(c => !c.requis || (state.identification[c.id] || "").toString().trim() !== "");
  if (i === 1) return CONFIG.capacite.every(q => state.capacite[q.id] !== undefined);
  if (i === 2) return CONFIG.tolerance.every(q => state.tolerance[q.id] !== undefined);
  if (i === 3) return CONFIG.connaissance.instruments.every(instr => { const r = state.connaissance[instr]; return r && r.connaissance !== undefined && r.experience !== undefined; });
  return true;
}

function renderCourbeQuestion(q, answers) {
  const maxAbs = Math.max(...q.options.map(o => Math.max(o.gain, o.perte)));
  const cards = q.options.map((opt, idx) => {
    const hPos = Math.max(4, Math.round((opt.gain / maxAbs) * 30));

    const sel = answers[q.id] === idx;
    return `<div class="curve-card ${sel ? "selected" : ""}" data-action="select-courbe" data-qid="${q.id}" data-idx="${idx}">

      <div class="val-neg">-${opt.perte}%</div>

  }).join("");
  return `<div class="question"><div class="q-label">${esc(q.label)}</div><div class="curve-grid">${cards}</div></div>`;
}

/* ----------------------------- GRAPHIQUE EN CAMEMBERT ----------------------------- */
function drawDonut(canvas, segments) {
  if (!canvas) return;
  const ctx = canvas.getContext && canvas.getContext("2d");
  if (!ctx) return;
  const dpr = window.devicePixelRatio || 1, size = 200;
  canvas.width = size * dpr; canvas.height = size * dpr; canvas.style.width = size + "px"; canvas.style.height = size + "px";
  ctx.scale(dpr, dpr);
  const cx = size / 2, cy = size / 2, rOuter = size / 2 - 4, rInner = rOuter * 0.55, rLabel = (rOuter + rInner) / 2;
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  let start = -Math.PI / 2;
  segments.forEach(seg => {
    if (seg.value <= 0) return;
    const angle = (seg.value / total) * Math.PI * 2, mid = start + angle / 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, rOuter, start, start + angle); ctx.closePath();
    ctx.fillStyle = seg.color; ctx.fill();
    if (seg.value / total > 0.05) {
      ctx.fillStyle = textColorFor(seg.color);
      ctx.font = "600 13px Inter, Arial, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(Math.round((seg.value / total) * 100) + "%", cx + Math.cos(mid) * rLabel, cy + Math.sin(mid) * rLabel);
    }
    start += angle;
  });
  ctx.beginPath(); ctx.arc(cx, cy, rInner, 0, Math.PI * 2); ctx.fillStyle = "#FFFDFA"; ctx.fill();
}

let supabaseClient = null;
function initSupabase() {

async function enregistrerReponse() {
  const statusEl = document.getElementById("save-status");
  if (!supabaseClient) { if (statusEl) statusEl.textContent = "Connexion Supabase non configurée — réponse non transmise."; return; }
  if (statusEl) statusEl.textContent = "Enregistrement en cours…";
  const r = dernierResultat;
  const payload = {
    organisation: CONFIG.organisation,
    nom: state.identification.nom || null,
    date_naissance: state.identification.dateNaissance || null,
    statut_matrimonial: state.identification.statutMatrimonial || null,
    objectif: state.identification.objectif || null,
    date_remplissage: state.identification.dateRemplissage || null,
    reponses_capacite: state.capacite,
    reponses_tolerance: state.tolerance,
    reponses_connaissance: state.connaissance,
    score_capacite: r.scoreCap, niveau_capacite: r.niveauCap,
    score_tolerance: r.scoreTol, niveau_tolerance: r.niveauTol,
    niveau_calcule: r.niveauCalcule, niveau_choisi: state.niveauChoisi,
    motif_ecart: state.motifEcart || null,
    garde_fou_declenche: gardeFouDeclenche(state.niveauChoisi),
    garde_fou_ack: state.gardeFouAck
  };
  try {
    const { error } = await supabaseClient.from(CONFIG.supabase.table).insert(payload);
    if (error) throw error;
    if (statusEl) statusEl.textContent = "✓ Réponse enregistrée";
  } catch (err) {
    console.error("Erreur d'enregistrement Supabase :", err);
    if (statusEl) statusEl.textContent = "⚠ Échec de l'enregistrement à distance (la réponse reste affichée ici, mais n'a pas été transmise).";
  }
}
async function chargerReponses() {
  const container = document.getElementById("reponses-container");
  if (!container) return;
  if (!supabaseClient) { container.innerHTML = '<p class="muted">Connexion Supabase non configurée (voir l\'onglet Identité de l\'outil).</p>'; return; }
  try {
    const { data, error } = await supabaseClient.from(CONFIG.supabase.table)
      .select("created_at,nom,niveau_calcule,niveau_choisi").order("created_at", { ascending: false }).limit(30);
    if (error) throw error;
    if (!data || data.length === 0) { container.innerHTML = '<p class="muted">Aucune réponse enregistrée pour le moment.</p>'; return; }
    const rows = data.map(r => `<tr><td>${esc(new Date(r.created_at).toLocaleString("fr-FR"))}</td><td>${esc(r.nom || "—")}</td><td>${r.niveau_calcule ?? "—"}</td><td>${r.niveau_choisi ?? "—"}</td></tr>`).join("");

  } catch (err) {
    container.innerHTML = '<p class="muted">Erreur lors du chargement : ' + esc(err.message || String(err)) + "</p>";
  }
}

/* ----------------------------- EXPORT / IMPORT DE LA CONFIGURATION ----------------------------- */
function exporterConfig() {
  const blob = new Blob([JSON.stringify(CONFIG, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "configuration-profil-risque.json"; a.click();
  URL.revokeObjectURL(url);
}
function importerConfig(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      Object.keys(CONFIG).forEach(k => delete CONFIG[k]);
      Object.assign(CONFIG, data);
      alert("Configuration importée avec succès.");
      render();
    } catch (err) { alert("Fichier invalide : " + err.message); }
  };
  reader.readAsText(file);
}

const app = document.getElementById("app");

app.addEventListener("input", e => {
  if (e.target.matches("[data-field]") && (e.target.type === "text" || e.target.type === "date")) {
    state.identification[e.target.dataset.field] = e.target.value;
    const btn = app.querySelector('[data-action="next"]');
    if (btn) btn.disabled = !validateStep(state.step);
  } else if (e.target.id === "champ-motifEcart") {
    state.motifEcart = e.target.value;
  } else if (e.target.matches("[data-path]") && e.target.type !== "checkbox" && e.target.type !== "file") {
    const path = e.target.dataset.path;
    setAt(CONFIG, path, e.target.dataset.type === "number" ? Number(e.target.value) : e.target.value);
    const m = path.match(/^allocation\.(\d+)\./);
    if (m) {
      const i = Number(m[1]), a = CONFIG.allocation[i], sum = a.obligataire + a.opcvm + a.actions + a.liquidites;
      const el = document.getElementById("sum-" + i);
      if (el) { el.textContent = `Somme actuelle : ${sum}% ${sum === 100 ? "✓" : "— doit totaliser 100%"}`; el.className = sum === 100 ? "sum-ok" : "sum-warn"; }
    }
  }
});

app.addEventListener("change", e => {
  if (e.target.matches("input[type=radio][data-qid]")) {
    state[e.target.dataset.bloc][e.target.dataset.qid] = Number(e.target.value); render();
  } else if (e.target.matches("select[data-field]") && e.target.dataset.field && CONFIG.identification.champs.some(c => c.id === e.target.dataset.field)) {
    state.identification[e.target.dataset.field] = e.target.value; render();
  } else if (e.target.matches("select[data-instr]")) {
    const instr = e.target.dataset.instr, field = e.target.dataset.field;
    if (!state.connaissance[instr]) state.connaissance[instr] = {};
    state.connaissance[instr][field] = e.target.value === "" ? undefined : Number(e.target.value);
    render();
  } else if (e.target.id === "champ-gardeFouAck") {
    state.gardeFouAck = e.target.checked; render();
  } else if (e.target.matches('[data-action="toggle-sensible"]')) {
    const idx = Number(e.target.dataset.instrumentIndex), name = CONFIG.connaissance.instruments[idx];
    const pos = CONFIG.connaissance.instrumentsSensibles.indexOf(name);
    if (e.target.checked) { if (pos === -1) CONFIG.connaissance.instrumentsSensibles.push(name); }
    else if (pos > -1) CONFIG.connaissance.instrumentsSensibles.splice(pos, 1);
  } else if (e.target.id === "import-file") {
    if (e.target.files && e.target.files[0]) importerConfig(e.target.files[0]);
  }
});

app.addEventListener("click", e => {
  const goto = e.target.closest('[data-action="goto"]');
  const courbe = e.target.closest('[data-action="select-courbe"]');
  const choixNiveau = e.target.closest('[data-action="choisir-niveau"]');
  const adminTab = e.target.closest('[data-action="goto-admin-section"]');
  const closeExp = e.target.closest('[data-action="close-explanation"]');
  const backdropClick = e.target.classList && e.target.classList.contains("modal-backdrop");
  const btn = e.target.closest("button[data-action]");

  if (goto) { const t = Number(goto.dataset.step); if (t <= state.step) { state.step = t; render(); window.scrollTo(0, 0); } return; }
  if (courbe) { state.tolerance[courbe.dataset.qid] = Number(courbe.dataset.idx); render(); return; }
  if (choixNiveau) { state.niveauChoisi = Number(choixNiveau.dataset.niveau); state.motifEcart = ""; render(); return; }
  if (adminTab) { adminSection = adminTab.dataset.section; render(); if (adminSection === "reponses") chargerReponses(); return; }
  if (closeExp || backdropClick) { showExplanation = false; render(); return; }
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === "show-explanation") { showExplanation = true; render(); }
  else if (action === "next") { if (validateStep(state.step)) { state.step++; if (state.step === 4) dernierResultat = calculerResultat(); render(); window.scrollTo(0, 0); } }
  else if (action === "prev") { state.step = Math.max(0, state.step - 1); render(); window.scrollTo(0, 0); }
  else if (action === "valider-profil") { state.valide = true; render(); enregistrerReponse(); }
  else if (action === "modifier-profil") { state.valide = false; render(); }
  else if (action === "telecharger-pdf") { telechargerPDF(); }
  else if (action === "toggle-admin") {
    if (mode === "client") {
      const pass = window.prompt("Mot de passe administrateur :");
      if (pass === CONFIG.adminPasscode) { mode = "admin"; adminSection = "identite"; }
      else if (pass !== null) alert("Mot de passe incorrect.");
    } else { mode = "client"; state = freshState(); dernierResultat = null; }
    render();
  }
  else if (action === "add-option") {
    const arr = getAt(CONFIG, btn.dataset.path);
    arr.push(btn.dataset.template === "courbe" ? { label: "Nouvelle courbe", points: 1, gain: 10, perte: 5 } : { label: "Nouvelle option", points: 1 });
    render();
  }
  else if (action === "add-question") {
    getAt(CONFIG, btn.dataset.path).push({ id: "q_" + Date.now(), label: "Nouvelle question", options: [{ label: "Option 1", points: 1 }] });
    render();
  }
  else if (action === "add-critere") {
    getAt(CONFIG, btn.dataset.path).push({ titre: "Nouveau critère", texte: "" });
    render();
  }
  else if (action === "remove-item") { removeAt(CONFIG, btn.dataset.path); render(); }
  else if (action === "add-list-item") { getAt(CONFIG, btn.dataset.path).push("Nouvelle option"); render(); }
  else if (action === "add-instrument") { CONFIG.connaissance.instruments.push("Nouvel instrument"); render(); }
  else if (action === "export-config") { exporterConfig(); }
  else if (action === "refresh-reponses") { chargerReponses(); }
});

initSupabase();
render();
</script>
</body>
</html>
